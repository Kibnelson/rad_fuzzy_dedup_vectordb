version: "3.9"
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: milvus-etcd
    command: [ "etcd", "-advertise-client-urls", "http://0.0.0.0:2379", "-listen-client-urls", "http://0.0.0.0:2379", "-listen-peer-urls", "http://0.0.0.0:2380", "-initial-advertise-peer-urls", "http://0.0.0.0:2380", "-initial-cluster", "default=http://0.0.0.0:2380", "-initial-cluster-state", "new", "-initial-cluster-token", "milvus-etcd" ]
    volumes:
      - ${MILVUS_DIR}/etcd:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: milvus-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: [ "server", "/data", "--console-address", ":9001" ]
    volumes:
      - ${MILVUS_DIR}/minio:/data
    ports: [ "9000:9000", "9001:9001" ]
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.4
    container_name: milvus-standalone
    entrypoint: [ "/tini", "--", "milvus", "run", "standalone" ]
    cpus: "28"
    mem_limit: "500g"
    cpuset: "0-28"
    volumes:
      - ${MILVUS_DIR}/milvus-data:/var/lib/milvus
      - ${MILVUS_DIR}/milvus.yaml:/milvus/configs/milvus.yaml
    environment:
      - MILVUS_MODE=standalone
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - GOMAXPROCS=60
      - OMP_NUM_THREADS=60
      - MKL_NUM_THREADS=60
    ports: [ "19530:19530", "9091:9091" ]
    depends_on: [ etcd, minio ]
    restart: unless-stopped
